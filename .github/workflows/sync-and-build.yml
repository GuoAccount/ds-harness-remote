name: Sync upstream & build ARM64 server image

# 每 6 小时把 fork 的 main 重置为上游 main + 本工作流这一个提交，
# 当 apps/server / packages/protocol / 锁文件有变化时构建 linux/arm64 镜像推到 GHCR。
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      force_build:
        description: 即使构建输入未变也强制重建镜像
        type: boolean
        default: false

concurrency:
  group: sync-and-build
  cancel-in-progress: false

env:
  UPSTREAM: liguobao/ds-harness-remote
  IMAGE: ghcr.io/guoaccount/ds-harness-remote/server
  WORKFLOW_FILE: .github/workflows/sync-and-build.yml

jobs:
  sync:
    name: Sync upstream
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
      head_sha: ${{ steps.diff.outputs.head_sha }}
      short_sha: ${{ steps.diff.outputs.short_sha }}
      server_version: ${{ steps.diff.outputs.server_version }}
    steps:
      - name: Check out fork
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Reset main to upstream, keep this workflow
        id: sync
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          PREV=$(git rev-parse HEAD)
          echo "prev_sha=$PREV" >> "$GITHUB_OUTPUT"

          git remote add upstream "https://github.com/${UPSTREAM}.git"
          git fetch upstream main --tags --force

          # 备份 fork 现有的全部 workflow 文件，reset 后原样放回。
          #
          # 为什么不跟随上游的 workflow 改动：GITHUB_TOKEN 没有 workflows 权限
          # （该权限对 GITHUB_TOKEN 根本不存在，只有 PAT 才有），而 push 中任何对
          # .github/workflows/* 的创建/更新/删除都会被 GitHub 拒绝：
          #   ! [remote rejected] HEAD -> main (refusing to allow a GitHub App to
          #     create or update workflow `.github/workflows/release.yml`
          #     without `workflows` permission)
          # 上游 2026-11-09 的 afd0e7e 改了 release.yml，同步因此失败。
          #
          # fork 的 CI / Release 都是 disabled_manually，本来就不跑，无需跟随。
          # 上游新增的 workflow 会被丢弃（远端没有，删掉不构成删除操作）；
          # 上游改动的 workflow 恢复成 fork 版本（内容未变，不触发权限检查）。
          #
          # 注意：reset 后工作流文件是 untracked，git diff 对 untracked 无感，
          # 所以是否推送必须用 tree 比对，不能用 git diff。
          rm -rf /tmp/keep-workflows && mkdir -p /tmp/keep-workflows
          cp -a .github/workflows/. /tmp/keep-workflows/
          git reset --hard upstream/main
          rm -rf .github/workflows
          mkdir -p .github/workflows
          cp -a /tmp/keep-workflows/. .github/workflows/
          git add -A .github/workflows

          NEW_TREE=$(git write-tree)
          OLD_TREE=$(git rev-parse "$PREV^{tree}")

          if [ "$NEW_TREE" = "$OLD_TREE" ]; then
            echo "内容与 fork main 完全一致，上游无更新"
            echo "synced=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "ci: 同步上游 $(git rev-parse --short upstream/main)"
            git push origin HEAD:main --force-with-lease
            echo "synced=true" >> "$GITHUB_OUTPUT"
          fi

          # tag 同步独立于 main 是否变化：上游可能只发 tag 不改 main。
          # 单 tag 用 --force 覆盖（上游 tag 可能被移动），整体失败不影响已完成的 main 推送。
          if git push origin --tags --force; then
            echo "tags pushed"
          else
            echo "::warning::tag 同步失败（可能受分支保护或并发限制影响）"
          fi

      - name: Detect build-relevant changes
        id: diff
        run: |
          set -euo pipefail
          echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "server_version=$(node -p "require('./apps/server/package.json').version")" >> "$GITHUB_OUTPUT"

          PREV="${{ steps.sync.outputs.prev_sha }}"
          if git diff --quiet "$PREV" HEAD -- \
               apps/server packages/protocol \
               package.json pnpm-lock.yaml pnpm-workspace.yaml tsconfig.base.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "构建输入无变化，跳过镜像构建"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "检测到服务端相关变更"
          fi

  build:
    name: Build linux/arm64 image
    needs: sync
    if: needs.sync.outputs.changed == 'true' || inputs.force_build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out synced revision
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.sync.outputs.head_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # type=sha 默认取 github.sha，那是触发本工作流的提交（可能是手动
          # workflow_dispatch 的那个），不是同步后真正参与构建的代码提交。
          # 显式用 head_sha，保证 sha- 标签能反查到构建内容。
          tags: |
            type=raw,value=latest
            type=raw,value=v${{ needs.sync.outputs.server_version }}
            type=raw,value=sha-${{ needs.sync.outputs.short_sha }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/Dockerfile
          platforms: linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=server-arm64
          cache-to: type=gha,mode=max,scope=server-arm64

      - name: Summary
        run: |
          {
            echo "### ARM64 镜像已推送"
            echo ""
            echo "- 镜像：\`${{ env.IMAGE }}:latest\`"
            echo "- 服务端版本：\`${{ needs.sync.outputs.server_version }}\`"
            echo "- 提交：\`${{ needs.sync.outputs.head_sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
